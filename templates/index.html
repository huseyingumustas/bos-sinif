<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boş Sınıf</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="header">
    <p id="gun">-</p>
    <p id="tarih">-</p>
    <p id="saat">-</p>
</div>

<div class="popup-overlay" id="popup">
    <div class="popup-icerik">
        <button class="popup-kapat" onclick="popupKapat()">✕</button>
        <div id="popup-icerik"></div>
    </div>
</div>

<div class="icerik">
    <div class="sol">
        <div class="filtreler">
            <button class="aktif" onclick="filtrele('tumu', this)">Tümü</button>
            <button onclick="filtrele('F', this)">F Blok</button>
            <button onclick="filtrele('B', this)">B Blok</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Durum</th>
                    <th>Sınıf</th>
                    <th>Saat</th>
                </tr>
            </thead>
        </table>
        <div class="tablo-wrapper">
            <table>
                <tbody id="tablo"></tbody>
            </table>
        </div>
    </div>

    <div class="sag" id="sag" style="display:flex">
        <div class="sag-bos">
            <span>🗺️</span>
            Bir sınıfa tıkla, kat planı burada görünsün
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
