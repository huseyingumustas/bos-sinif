<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111111;
        }
        .kutu {
            width: min(100%, 420px);
            background: white;
            padding: 2rem;
            border-radius: 14px;
            border: 1px solid #1a3a6b;
            box-shadow: 0 12px 30px rgba(26, 58, 107, 0.08);
        }
        h1 {
            color: #1a3a6b;
            margin: 0 0 0.5rem;
            font-size: 1.75rem;
        }
        .aciklama {
            color: #5b6473;
            margin: 0 0 1.5rem;
            line-height: 1.5;
        }
        form {
            display: grid;
            gap: 1rem;
        }
        input {
            width: 100%;
            min-height: 46px;
            padding: 0.75rem 0.9rem;
            border: 1px solid #cdd5e1;
            border-radius: 10px;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #1a3a6b;
            box-shadow: 0 0 0 3px rgba(26, 58, 107, 0.12);
        }
        button {
            min-height: 46px;
            background: #1a3a6b;
            color: white;
            padding: 0.75rem 1.25rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
        }
        .hata {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
            padding: 0.85rem 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            line-height: 1.5;
        }
        .countdown {
            display: inline-block;
            font-weight: 700;
            color: #7f1d1d;
        }
        @media (max-width: 640px) {
            body { padding: 1rem; }
            .kutu { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="kutu">
        <h1>Admin Login</h1>
        <p class="aciklama">Sign in to manage classroom schedule entries.</p>

        {% if error_message %}
        <div class="hata" id="lockout-message" data-lockout-seconds="{{ lockout_seconds or 0 }}">{{ error_message }}</div>
        {% endif %}

        <form action="/admin-login" method="POST">
            <input name="csrf_token" type="hidden" value="{{ csrf_token }}">
            <input name="sifre" type="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
    </div>

    <script>
        const lockoutMessage = document.getElementById('lockout-message');
        if (lockoutMessage) {
            let remainingSeconds = parseInt(lockoutMessage.dataset.lockoutSeconds || '0', 10);

            function renderCountdown() {
                if (remainingSeconds > 0) {
                    lockoutMessage.innerHTML = `Too many failed attempts. Try again in <span class="countdown">${remainingSeconds}</span> seconds.`;
                }
            }

            if (remainingSeconds > 0) {
                renderCountdown();
                const timer = setInterval(() => {
                    remainingSeconds -= 1;
                    if (remainingSeconds <= 0) {
                        clearInterval(timer);
                        lockoutMessage.textContent = 'You can try signing in again now.';
                        return;
                    }
                    renderCountdown();
                }, 1000);
            }
        }
    </script>
</body>
</html>
